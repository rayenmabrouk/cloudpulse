# Weekly dependency update PRs. Every PR runs the full CI (tests, lint, image
# build + smoke test + Trivy) before it can be merged.
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in Dockerfile.hardened
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # AWS / random provider versions (terraform/.terraform.lock.hcl)
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly

  # Python dependencies of the inherited dpaste application
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
