services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/dpaste.sqlite
      - SECRET_KEY=local-dev-secret-key-not-for-production
      - DEBUG=True
      - ALLOWED_HOSTS=*
    volumes:
      - dpaste_data:/data
    restart: unless-stopped

volumes:
  dpaste_data: