apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Uses the AWS SDK default credential chain (~/.aws mounted read-only)
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    jsonData:
      authType: default
      defaultRegion: us-east-1