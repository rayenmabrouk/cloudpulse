global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Black-box HTTP probes: local container (static) + production (file-based,
  # written by set-production-target.ps1 because the sslip.io hostname changes with the IP)
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://dpaste:8000/"]
        labels:
          env: local
    file_sd_configs:
      - files: ["/etc/prometheus/targets.d/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox:9115"]
